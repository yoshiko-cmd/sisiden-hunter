# 収集クエリ定義(3階層)
#
# config/keywords.yaml が「集めた案件をどう採点するか」を定義するのに対し、
# このファイルは「そもそも何を取りに行くか」を定義する。
#
# 官公需APIのQueryは案件名・機関名・公告文を対象に全文検索する。
# 案件名に「映像」「動画」と書かれていなくても、物語にできる案件を拾うため、
# 3階層で網を張り、絞り込みはDB側のルールベーススコアリングで行う。
#
# mode:
#   standalone … そのままOR検索式にして投げる
#   combined   … words を modifiers とAND結合する
#                例: (社会課題 OR 地域課題) AND (広報 OR 発信 OR PR)
#                テーマ語だけでは無関係な案件を大量に取得してしまうため。
#
# chunk_size はURL長に配慮した1リクエストあたりの語数。

tiers:
  A:
    label: "映像・ドキュメンタリー(最優先)"
    mode: standalone
    chunk_size: 8
    words:
      - 映像
      - 動画
      - 映像制作
      - 動画制作
      - ドキュメンタリー
      - 密着
      - 人物取材
      - 記録映像

  B:
    label: "広報・発信・PR"
    mode: standalone
    chunk_size: 8
    words:
      - 広報
      - 魅力発信
      - 情報発信
      - PR
      - プロモーション
      - コンテンツ
      - ブランディング
      - シティプロモーション

  C:
    label: "テーマ(社会課題・地域産業・若者・地域)"
    mode: combined
    chunk_size: 6
    # テーマ語単独では大量取得になるため、発信・取材系の語とAND結合する
    modifiers:
      - 広報
      - 発信
      - PR
      - プロモーション
      - コンテンツ
      - 取材
      - 映像
      - 動画
    words:
      - 社会課題
      - 地域課題
      - 地域産業
      - 地場産業
      - ものづくり
      - 職人
      - 若者
      - 学生
      - 担い手
      - 関係人口
      - 移住
      - 地方創生
      - 地域活性化
      - まちづくり
      - 探究学習
      - キャリア教育
      - 官民連携
      - 産学連携
