# SISIDEN キーワード定義(要件6〜10)
#
# ■ 設計方針(実データでの検証結果を反映)
#
# 実データ890件で検証したところ、公告文の全文に対する単純なキーワード一致では
# 建設工事案件が軒並み95〜100点になった。原因は以下の3点。
#
#   1. 「密着」は建設・林業の専門用語(塗装の密着性、密着造林型)として頻出する
#   2. 「撮影」「編集」は工事写真撮影や書類編集として、ほぼ全ての工事仕様書に出る
#   3. 「環境」「災害」「福祉」「教育」「中小企業」等は官公需の公告文の定型文
#      (中小企業者の受注機会確保、環境への配慮 等)に必ず含まれる
#
# そこで二段階方式にした。
#
#   第1段階(anchor): 映像制作案件である裏付けがあるか判定する
#   第2段階(groups): 裏付けがある案件に対してのみ、テーマによる加点を行う
#
# 裏付けが無い案件は、案件名にテーマ語がある場合のみ低い上限(no_anchor_max_score)で
# 拾う。要件39の「案件名に映像と書いていなくても物語にできる案件は重要」に配慮しつつ、
# 公告文の定型文による誤検出を防ぐため。

# ------------------------------------------------------------------
# 第1段階: 映像案件の裏付け(anchor)
# ------------------------------------------------------------------
anchor:
  # 単独で映像制作案件と判断できる語。定型文には出ないため、
  # 案件名・公告文・仕様書本文のどこに出ても裏付けとして扱う。
  strong:
    - 映像制作
    - 動画制作
    - 映像コンテンツ
    - 動画コンテンツ
    - 映像作品
    - 映像業務
    - 動画広告
    - PR動画
    - PR映像
    - プロモーション動画
    - プロモーション映像
    - 広報動画
    - 広報映像
    - 観光動画
    - 採用動画
    - 紹介動画
    - ブランディング動画
    - SNS動画
    - YouTube
    - 動画編集
    - 映像編集
    - 動画撮影
    - 映像撮影
    - 番組制作
    - CM制作
    - ドキュメンタリー
    - documentary
    - 密着取材
    - 人物取材
    - 取材映像
    - 記録映像
    - 記録動画
    - 映像記録
    - 動画配信
    - 映像配信

  # 案件名に出たときだけ裏付けとして扱う語。
  # 公告文や仕様書の全文では、工事写真撮影・書類編集・監視映像などに紛れるため。
  # 実データに現れた映像制作案件の表現を随時追加している。
  title_only:
    - 映像
    - 動画
    - 撮影
    - 編集
    - 取材
    - コンテンツ
    - ドラマ
    - ショートドラマ
    - ショートフィルム
    - 映画
    - エンドロール
    - アニメーション
    - モーショングラフィック
    - 番組
    - 放送
    - CM
    - ムービー
    - フィルム

# 裏付けが無い案件の上限スコア。案件名にテーマ語がある場合のみここまで加点する。
no_anchor_max_score: 30

# ------------------------------------------------------------------
# 第2段階: テーマによる加点
# ------------------------------------------------------------------
groups:
  video:
    label: "映像・動画 (GROUP A)"
    score: 25
    words:
      - 映像
      - 動画
      - 映像制作
      - 動画制作
      - 映像コンテンツ
      - 動画コンテンツ
      - PR動画
      - PR映像
      - プロモーション動画
      - プロモーション映像
      - YouTube
      - SNS動画
      - 広報動画
      - 観光動画
      - 採用動画
      - 紹介動画
      - ブランディング動画

  documentary:
    label: "ドキュメンタリー (GROUP B・最優先)"
    score: 30
    # 「密着」単独は建設・林業の専門用語と衝突するため、必ず取材・映像と
    # 結びついた形の語のみを使う。
    words:
      - ドキュメンタリー
      - documentary
      - 密着取材
      - 密着ドキュメント
      - 人物取材
      - 追跡取材
      - 現場取材
      - 取材映像
      - 記録映像
      - 記録動画
      - インタビュー
      - ストーリーテリング
      - 物語性

  social_issue:
    label: "社会課題 (GROUP C)"
    score: 10
    words:
      - 社会課題
      - 地域課題
      - 人口減少
      - 過疎
      - 少子高齢化
      - 人材不足
      - 担い手不足
      - 後継者不足
      - 孤立
      - 不登校
      - 貧困
      - 復興
      - 脱炭素
      - 空き家
      - 地域交通

  local_industry:
    label: "地域産業 (GROUP D)"
    score: 10
    words:
      - 地域産業
      - 地場産業
      - 産業振興
      - ものづくり
      - 町工場
      - 職人
      - 伝統産業
      - 伝統工芸
      - 一次産業
      - 観光産業
      - 商店街
      - 事業承継

  youth:
    label: "若者 (GROUP E)"
    score: 10
    words:
      - 若者
      - 若年層
      - 高校生
      - 大学生
      - 中学生
      - 次世代
      - Z世代
      - キャリア教育
      - 探究学習
      - 地域留学
      - 起業
      - スタートアップ

  community:
    label: "地域・コミュニティ (GROUP F)"
    score: 10
    words:
      - 地域活性化
      - 地方創生
      - 地域創生
      - まちづくり
      - 関係人口
      - 移住
      - 定住
      - シティプロモーション
      - 地域ブランディング
      - 地域コミュニティ
      - 居場所
      - 官民連携
      - 産学連携
      - オープンファクトリー
      - 地域交流

  education:
    label: "教育・探究"
    score: 10
    # 「教育」単独は教育委員会が発注する全案件に一致するため使わない。
    words:
      - 探究学習
      - キャリア教育
      - 学習プログラム
      - 出前授業
      - 総合的な学習
      - 食育
      - 主権者教育

# ------------------------------------------------------------------
# 主人公性の一次判定フラグ(要件10)。最終判断はMCPクライアント側。
# ------------------------------------------------------------------
