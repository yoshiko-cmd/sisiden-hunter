# 官公需情報ポータルサイト 検索API 接続設定
#
# 出典: 公式APIガイド V1.1 (https://www.kkj.go.jp/doc/ja/api_guide.pdf)
#   - エンドポイント: http://www.kkj.go.jp/api/  (2章)
#   - 検索パラメータ: Query / Project_Name / Organization_Name / LG_Code のいずれか1つ以上が必須。
#     複数指定時はAND条件。GET/POSTどちらでも可(混在不可)。パラメータの順序は任意。
#   - Count: 返却する最大件数。★デフォルトはわずか10件。未指定だと取りこぼすため必ず指定する。
#     1,000以上を指定した場合は1,000とみなされる(3章)。
#   - 検索文字列は検索式が使える(3.1): AND(省略可) / OR / ANDNOT / NOT / ()。
#     演算子の前後には半角空白が必要。AND NOTよりANDNOTが推奨(検索システムへの負荷が少ない)。
#   - LG_Codeは半角カンマ区切りで複数都道府県を指定可能。
#   - ASCII以外を含む文字列はUTF-8。数値・英字・期間はすべて半角。
#   - 期間パラメータ: CFT_Issue_Date(公告日) / Tender_Submission_Deadline(入札開始日)
#     / Opening_Tenders_Event(開札日) / Period_End_Time(納入期限日)
#     形式: "YYYY-MM-DD/" | "YYYY-MM-DD/YYYY-MM-DD" | "YYYY-MM-DD" | "/YYYY-MM-DD"
#   - レスポンス: XML。1件 = <SearchResult>。最大1,000件。
#   - 機関名は「前後方・途中一致」で処理される(6.2)。
#   - タグの出現順序は不定。オプション項目は該当情報が無い場合、タグ自体が出力されない(4.2)。

endpoint: "https://www.kkj.go.jp/api/"
method: "GET"
timeout_seconds: 30
max_retries: 3
retry_backoff_seconds: 2

# サーバー負荷軽減のため、連続リクエスト間に待機を入れる(利用規約の同時リクエスト数制限に配慮)
request_interval_seconds: 1.0

# 検索パラメータ名(APIガイド 3章)
request_params:
  query_param: "Query"
  project_name_param: "Project_Name"
  organization_name_param: "Organization_Name"
  lg_code_param: "LG_Code"
  count_param: "Count"
  certification_param: "Certification"
  category_param: "Category"
  procedure_type_param: "Procedure_Type"
  cft_issue_date_param: "CFT_Issue_Date"
  tender_submission_deadline_param: "Tender_Submission_Deadline"
  opening_tenders_event_param: "Opening_Tenders_Event"
  period_end_time_param: "Period_End_Time"

# 1リクエストあたりの取得件数。APIの上限は1,000、未指定時のデフォルトは10。
default_count: 1000
max_count: 1000

# 1回の検索式に含めるキーワード数の上限(URL長に配慮してOR検索を分割する)
or_query_chunk_size: 10

# 注意: Category(1.物品 2.工事 3.役務)とProcedure_Type(1.一般競争入札
# 2.簡易公募型競争入札 3.簡易公募型指名競争入札)はAPIガイド上「灰色部分」として
# 「完全にデータが整備されておりません」と明記されている。これらで絞り込むと
# 取りこぼすため、収集時には指定せず、DB側のスコアリングで絞り込む方針とする。

# レスポンスXMLのタグ名 -> 内部フィールド名の対応(APIガイド 4.1/4.2)
response_fields:
  record_xpath: ".//SearchResult"   # 案件1件を表す要素
  error_xpath: ".//Error"           # エラー時は <Results><Error>...</Error></Results>
  search_hits_xpath: ".//SearchHits"
  source_key: "Key"                  # システム内で一意のキー
  project_name: "ProjectName"
  organization_name: "OrganizationName"
  prefecture: "PrefectureName"
  prefecture_code: "LgCode"
  municipality: "CityName"
  municipality_code: "CityCode"
  category: "Category"               # 物品 / 役務 / 工事
  procedure_type: "ProcedureType"    # 一般競争入札、指名競争入札など
  published_date: "CftIssueDate"     # 公告日(存在しない場合はデータ取得日)
  deadline: "TenderSubmissionDeadline"
  opening_date: "OpeningTendersEvent"
  period_end_time: "PeriodEndTime"   # 納入期限日
  external_url: "ExternalDocumentURI"
  description: "ProjectDescription"  # 公告文全文(画像PDFの場合は存在しないことがある)
  location: "Location"               # 履行場所・納入場所
  certification: "Certification"     # 参加資格 (A/B/C/D等、空白区切り)
  item_code: "ItemCode"
  attachments_container: "Attachments"
  attachment_item: "Attachment"
  attachment_name: "Name"
  attachment_uri: "Uri"

# 注意: 予定価格・予算額を表すタグはこのAPIには存在しない。
# budget_text/budget_min/budget_max は添付の公告文PDFを読んだ上で
# MCPクライアント側が判断するか、将来的に別途抽出する。

